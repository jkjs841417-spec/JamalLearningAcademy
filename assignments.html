
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments | Jamal Learning Academy</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .assignment-container {
      max-width: 1000px;
      margin: 45px auto;
      padding: 20px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .page-header h1 {
      color: #d6ad55;
      font-size: 34px;
      margin-bottom: 10px;
    }

    .page-header p {
      color: #aaa;
    }

    .assignment-card {
      background: #111d32;
      border: 1px solid #34435b;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 16px;
    }

    .assignment-card h2 {
      color: #fff;
      font-size: 19px;
      margin-bottom: 10px;
    }

    .assignment-card p {
      color: #b9c2d0;
      line-height: 1.7;
      font-size: 14px;
    }

    .assignment-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .assignment-meta span {
      background: #26364c;
      color: #e3bd6a;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
    }

    .empty-state {
      background: #111d32;
      border: 1px solid #34435b;
      border-radius: 12px;
      padding: 35px 20px;
      text-align: center;
      margin-top: 20px;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .empty-state h2 {
      color: #fff;
      margin-bottom: 10px;
    }

    .empty-state p {
      color: #b9c2d0;
      line-height: 1.7;
    }

    .page-links {
      text-align: center;
      margin-top: 30px;
    }

    .page-links a {
      color: #d6ad55;
      text-decoration: none;
      margin: 0 8px;
    }

    @media (max-width: 600px) {
      .page-header h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="assignment-container">

    <header class="page-header">
      <h1>My Assignments</h1>
      <p>Practice your skills and track your assignment submissions.</p>
    </header>

    <section class="empty-state">
      <div class="icon">📝</div>

      <h2>No Assignments Available</h2>

      <p>
        Your course assignments will appear here after they are
        published by the academy. Keep learning and stay updated.
      </p>
    </section>

    <nav class="page-links">
      <a href="dashboard.html">Dashboard</a>
      |
      <a href="my-courses.html">My Courses</a>
      |
      <a href="progress.html">My Progress</a>
      |
      <a href="index.html">Home</a>
    </nav>

  </main>

</body>
</html>
